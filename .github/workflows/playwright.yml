name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: earlycareering_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: testpassword
      DB_NAME: earlycareering_test

      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-chars-minimum

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Install application dependencies
        working-directory: early-careering
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Drizzle migrations
        working-directory: early-careering
        run: npx drizzle-kit migrate

      - name: Inspect CI database
        env:
          MYSQL_PWD: ${{ env.DB_PASSWORD }}
        run: |
          mysql --protocol=TCP \
            -h "$DB_HOST" \
            -P "$DB_PORT" \
            -u "$DB_USER" \
            "$DB_NAME" \
            -e 'SELECT DATABASE(); SHOW TABLES; SELECT COUNT(*) AS user_count FROM `user`;'

      - name: Build project
        run: |
          npm --prefix early-careering run dev > server.log 2>&1 &
          SERVER_PID=$!

          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          npx --no-install wait-on \
            --verbose \
            --timeout 60000 \
            http://localhost:3000 || {
              echo "Application failed to start:"
              cat server.log
              exit 1
            }

          echo "Application is ready. Starting tests."
          npm test
      - name: Upload Cucumber test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-results
          path: |
            test-results/
            playwright-report/
            cucumber-report.html
            cucumber-report.json
            server.log
          retention-days: 7
          if-no-files-found: warn
